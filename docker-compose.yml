# 部署：cp deploy.env.example deploy.env，填好后 docker compose up -d --build
services:
  app:
    build: .
    env_file: deploy.env
    volumes:
      - speakpal-data:/data
    restart: unless-stopped

  # Caddy 自动申请并续期 HTTPS 证书；DOMAIN 需已解析到这台服务器
  caddy:
    image: caddy:2-alpine
    env_file: deploy.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  speakpal-data:
  caddy-data:
